name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm test` runs node:test over the translation layer. There is nothing
      # to install -- the bridge has no dependencies and no build step, and the
      # suite never opens a socket or calls the upstream API.
      - run: npm test
